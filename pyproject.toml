[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "psycopg[binary,pool]>=3.3.6",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.1",
    "anthropic>=2.6.0",
    "langchain-anthropic>=1.7.10",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
    "qdrant-client>=1.20.0",
    "langchain-qdrant>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "requests>=2.34.2",
    "mermaid-magic>=0.1.4",
    "pandas>=3.1.1",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
