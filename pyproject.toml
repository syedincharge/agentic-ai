[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "pydantic>=2.14.1",
    "anthropic>=2.6.0",
    "langchain-anthropic>=1.7.10",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
